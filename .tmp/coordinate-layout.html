<!doctype html><meta charset="utf-8"><style>:host {
  display: block;
  width: 100%;
}

.menu-container {
  width: 100%;
  display: flex;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 0;
  padding: 0;
  box-sizing: border-box;
  border: 1px solid rgba(174, 190, 74, 0.14);
  background: linear-gradient(180deg, rgba(7, 10, 7, 0.98), rgba(12, 16, 11, 0.96));
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.26);
}

.menu-item {
  min-width: 140px;
  min-height: 50px;
  flex: 0 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.75rem 1rem;
  border: 1px solid rgba(174, 190, 74, 0.14);
  border-right: 0;
  background: linear-gradient(180deg, rgba(20, 26, 18, 0.98), rgba(12, 16, 11, 0.98));
  color: #d8ddcf;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  box-sizing: border-box;
  transition:
    background-color 160ms ease,
    color 160ms ease,
    transform 120ms ease,
    box-shadow 160ms ease,
    filter 160ms ease;
}

.menu-item:first-child {
  border-left: 1px solid rgba(174, 190, 74, 0.14);
}

.menu-item:last-child {
  border-right: 1px solid rgba(174, 190, 74, 0.14);
}

.menu-item:hover {
  background: linear-gradient(180deg, rgba(30, 37, 25, 0.98), rgba(16, 20, 15, 0.98));
  color: #dce79a;
  filter: brightness(1.06);
  box-shadow: inset 0 0 0 1px rgba(174, 190, 74, 0.12);
}

.menu-item:active {
  transform: translateY(1px);
  background: linear-gradient(180deg, rgba(12, 16, 11, 0.98), rgba(20, 25, 18, 0.98));
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.34);
}

.menu-item--active {
  background: linear-gradient(180deg, rgba(30, 37, 25, 0.98), rgba(16, 20, 15, 0.98));
  color: #dce79a;
  box-shadow: inset 0 0 0 1px rgba(174, 190, 74, 0.18);
  filter: brightness(1.05);
}

.menu-item:focus-visible {
  outline: 2px solid rgba(210, 222, 114, 0.9);
  outline-offset: -2px;
  position: relative;
  z-index: 1;
}

.floating-window {
  position: fixed;
  z-index: 5000;
  display: flex;
  flex-direction: column;
  min-width: 420px;
  min-height: 300px;
  background: linear-gradient(180deg, rgba(10, 14, 10, 0.98), rgba(6, 9, 6, 0.98));
  border: 1px solid rgba(174, 190, 74, 0.22);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  overflow: hidden;
  border-radius: 12px;
  transform: translate3d(0, 0, 0);
  will-change: transform, width, height;
}

.floating-window--iconos {
  min-width: 350px;
  z-index: 5100;
}

.floating-window__header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.8rem 0.95rem;
  background: linear-gradient(180deg, rgba(16, 21, 15, 0.98), rgba(10, 14, 10, 0.98));
  border-bottom: 1px solid rgba(174, 190, 74, 0.14);
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.floating-window__header:active {
  cursor: grabbing;
}

.floating-window__title {
  color: #d9ddc5;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.floating-window__close {
  width: 2rem;
  height: 2rem;
  display: grid;
  place-items: center;
  border: 1px solid rgba(174, 190, 74, 0.18);
  border-radius: 6px;
  background: rgba(154, 173, 65, 0.06);
  color: #d8ddcf;
  cursor: pointer;
  transition:
    background 160ms ease,
    color 160ms ease,
    border-color 160ms ease;
}

.floating-window__close:hover {
  background: rgba(174, 190, 74, 0.14);
  border-color: rgba(174, 190, 74, 0.4);
  color: #eff4bd;
}

.floating-window__content {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow: auto;
  background: rgba(6, 9, 6, 0.94);
}

.floating-window__content app-graficar {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 100%;
}

.floating-window__content--iconos {
  background: rgba(6, 9, 6, 0.94);
}

.resize-handle {
  position: absolute;
  z-index: 2;
}

.resize-handle--se {
  right: 0;
  bottom: 0;
  width: 18px;
  height: 18px;
  cursor: nwse-resize;
  touch-action: none;
  background:
    linear-gradient(
      135deg,
      transparent 0,
      transparent 35%,
      rgba(174, 190, 74, 0.55) 35%,
      rgba(174, 190, 74, 0.55) 45%,
      transparent 45%,
      transparent 55%,
      rgba(174, 190, 74, 0.55) 55%,
      rgba(174, 190, 74, 0.55) 65%,
      transparent 65%
    );
  opacity: 0.8;
}

@media (max-width: 1024px) {
  .menu-item {
    min-width: 124px;
    min-height: 48px;
    padding-inline: 0.85rem;
    font-size: 0.78rem;
  }

  .floating-window {
    min-width: 360px;
  }

  .floating-window--iconos {
    min-width: 350px;
  }
}

@media (max-width: 768px) {
  .menu-container {
    padding: 0;
  }

  .menu-item {
    min-width: 120px;
    min-height: 46px;
    font-size: 0.74rem;
    padding-inline: 0.8rem;
  }

  .floating-window {
    min-width: 0;
    border-radius: 10px;
  }

  .floating-window--iconos {
    min-width: 0;
  }
}

@media (max-width: 480px) {
  .menu-item {
    flex: 1 1 calc(50% - 0px);
    min-width: 0;
  }

  .floating-window {
    left: 8px !important;
    top: 8px !important;
    width: calc(100vw - 16px) !important;
    height: calc(100dvh - 16px) !important;
  }
}

@media (max-width: 360px) {
  .menu-item {
    flex-basis: 100%;
  }
}

.limits-content {
  height: auto;
  min-height: 0;
  overflow: auto;
  background: #071007;
  color: #dce7d0;
  font-family: inherit;
}

.limits-workspace {
  display: grid;
  /* El formulario pasa de 48% a 56%: gana un 16,7% sin ampliar la ventana. */
  grid-template-columns: minmax(0, 56fr) minmax(0, 44fr);
  gap: 12px;
  padding: 12px;
  min-height: 0;
}

.limits-left, .limits-right {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.limits-panel {
  background: #0a1409;
  border: 1px solid #26351b;
  border-radius: 5px;
  padding: 11px;
  min-width: 0;
}

.limits-panel-title,
.limits-panel-heading {
  color: #b3a363;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .65px;
  margin-bottom: 10px;
}

.limits-panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.limits-label {
  display: block;
  color: #879278;
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 5px;
}

.limits-input {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: 32px;
  background: #182612;
  border: 1px solid #2c3c23;
  border-radius: 3px;
  color: #e4ebd8;
  padding: 5px 7px;
  font: inherit;
  font-size: 12px;
}

.limits-input:focus {
  outline: 1px solid #c8ad60;
}

.limits-coord-grid {
  display: grid;
  /* Ambas filas comparten columnas; segundos y decimal reciben mas espacio. */
  grid-template-columns: minmax(0, .9fr) minmax(0, .65fr) minmax(0, .65fr) minmax(0, 1.05fr) minmax(0, 1.65fr);
  gap: 8px 6px;
  align-items: center;
}

.limits-coord-grid > span {
  color: #a3ae93;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}

/* Solo los controles de coordenadas: no altera nombre ni selectores de estilo. */
.limits-coord-grid > .limits-input {
  height: 36px;
  padding: 7px 5px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  line-height: normal;
  text-align: center;
  border-color: #35492b;
  border-radius: 4px;
}

/* Retira unicamente las flechas visuales para aprovechar el ancho del numero.
   El tipo number, sus limites y la interaccion de teclado permanecen intactos. */
.limits-coord-grid > input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
.limits-coord-grid > input[type="number"]::-webkit-inner-spin-button,
.limits-coord-grid > input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.limits-coord-grid > .limits-input:focus {
  border-color: #b5a359;
  outline: 2px solid #c8ad60;
  outline-offset: 1px;
  box-shadow: 0 0 0 3px rgb(181 163 89 / 12%);
}

.limits-btn {

  border-radius: 3px;
  padding: 8px 11px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .25px;
  cursor: pointer;

}

.limits-btn-blue {

}

.limits-btn-gold {

.limits-status {
  color: #75b67c;

}

.limits-footer-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* Conserva las dimensiones existentes y permite ambas acciones por fila sin solaparse. */
.limits-vertex-actions { display: flex; flex-wrap: wrap; gap: 4px; }
.limits-row-editing td { background: #26351b; }

/* El dialogo ya tiene altura del administrador: no restar una cabecera supuesta.
   Esta especificidad prevalece sobre overflow:auto heredado de menu.css. */
.systems-window { container: limits-window / inline-size; }
.systems-window, .systems-window * { box-sizing: border-box; }
.systems-window > .floating-window__header { flex: 0 0 auto; }
.systems-window .limits-content {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  overflow: visible;
}
.systems-window .limits-content[hidden] { display: none; }
.limits-workspace { flex: 1 1 0; min-width: 0; }
.limits-left, .limits-right { min-height: 0; }
.limits-left { overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.limits-left > .limits-panel { flex: 0 0 auto; }
.limits-panel-heading { flex-wrap: wrap; }
.limits-panel-heading > span, .limits-coord-grid > span { min-width: 0; overflow-wrap: anywhere; }
.limits-viewer-panel { flex: 1 1 0; min-height: 0; }
.limits-viewer-panel > .limits-panel-heading, .limits-viewer-summary { flex: 0 0 auto; }
.limits-viewer { flex: 1 1 0; min-width: 0; }
/* El SVG no aporta su altura intrinseca al calculo Flexbox del panel. */
.limits-viewer svg { position: absolute; inset: 0; display: block; }
.limits-viewer-summary { flex-wrap: wrap; overflow-wrap: anywhere; }
.limits-table-wrap { overflow-y: auto; }
.limits-table { table-layout: fixed; }
.limits-table th, .limits-table td { overflow-wrap: anywhere; }
.limits-table th:first-child { width: 17%; }
.limits-table th:nth-child(2), .limits-table th:nth-child(3) { width: 22%; }
.limits-table th:last-child { width: 39%; }
.limits-color-picker { min-width: 0; }
/* El pie ocupa su espacio real y nunca forma parte del scroll del formulario. */
.limits-footer { flex: 0 0 auto; flex-wrap: wrap; min-width: 0; }
.limits-status { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.limits-footer-actions { flex: 0 1 auto; min-width: 0; justify-content: flex-end; }
.limits-footer-actions .limits-btn { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; }

/* Responde al ancho de la ventana flotante, aunque el navegador siga maximizado.
   En una columna solo se desplaza el area central; cabecera y pie permanecen visibles. */
@container limits-window (max-width: 820px) {
  .limits-workspace { grid-template-columns: minmax(0, 1fr); overflow-y: auto; align-content: start; }
  .limits-left { overflow-y: visible; scrollbar-gutter: auto; }
  .limits-right { min-height: 260px; }
  .limits-footer-actions { flex: 1 1 100%; }
  .limits-footer-actions .limits-btn { flex: 1 1 105px; }
}

/* En ventanas pequenas cada encabezado ocupa una fila, con latitud y longitud
   en columnas paralelas. Conserva DOM, orden de Tab, etiquetas y bindings. */
@container limits-window (max-width: 460px) {
  .limits-coord-grid {
    grid-template-columns: minmax(0, .75fr) repeat(2, minmax(0, 1.25fr));
    gap: 8px;
  }
  .limits-coord-grid > span { grid-column: 1; text-align: left; }
  .limits-coord-grid > .limits-input { font-size: 12px; padding-inline: 4px; }
  .limits-coord-grid > :nth-child(1), .limits-coord-grid > :nth-child(6), .limits-coord-grid > :nth-child(11) { grid-row: 1; }
  .limits-coord-grid > :nth-child(2), .limits-coord-grid > :nth-child(7), .limits-coord-grid > :nth-child(12) { grid-row: 2; }
  .limits-coord-grid > :nth-child(3), .limits-coord-grid > :nth-child(8), .limits-coord-grid > :nth-child(13) { grid-row: 3; }
  .limits-coord-grid > :nth-child(4), .limits-coord-grid > :nth-child(9), .limits-coord-grid > :nth-child(14) { grid-row: 4; }
  .limits-coord-grid > :nth-child(5), .limits-coord-grid > :nth-child(10), .limits-coord-grid > :nth-child(15) { grid-row: 5; }
  .limits-coord-grid > :nth-child(n+6):nth-child(-n+10) { grid-column: 2; }
  .limits-coord-grid > :nth-child(n+11) { grid-column: 3; }
}

const values=['S','90','59','59.999999','-90.000000','W','180','59','59.999999','-180.000000'];
controls.forEach((el,i)=>el.value=values[i]);
const checks=[320,390,420,460,480,680,700,701,703,720,750,820,821,825,850,1100,1920].map(width=>{
